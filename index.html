<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Arpita ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background: linear-gradient(-45deg,#ff0080,#7928ca,#ff4d88,#ffb6c1);
background-size:400% 400%;
animation:bg 10s ease infinite;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

  .container{
text-align:center;
color:white;
backdrop-filter:blur(18px);
background:rgba(255,255,255,0.15);
padding:45px;
border-radius:30px;
box-shadow:0 0 50px rgba(255,255,255,0.35);
border:1px solid rgba(255,255,255,0.3);
  }

h1{
font-size:50px;
margin-bottom:15px;
text-shadow:0 0 20px rgba(255,255,255,0.8);
}

p{
font-size:20px;
margin-bottom:30px;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:50px;
background:white;
color:#ff2d75;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 25px white;
}

#msg{
display:none;
margin-top:30px;
font-size:22px;
line-height:1.6;
animation:fade 1.5s ease;
text-shadow:0 0 15px rgba(255,255,255,0.7);
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.heart{
position:absolute;
color:#fff;
font-size:22px;
animation:float 5s linear infinite;
filter:drop-shadow(0 0 10px white);
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120vh);
opacity:1;
}
}
</style>

</head>

<body>

<div class="container">

<h1>For Arpita ❤️</h1>

<p>Happy Girlfriend's Day 🌸</p>

<button onclick="showLove()">Tap Here ❤️</button>

<div id="msg">
You are the most beautiful chapter of my life.<br><br>

No matter where life takes us,<br>
you'll always have a special place in my heart. ❤️<br><br>

Love You Forever ♾️
</div>

</div>

<script>

function showLove(){

let msg=document.getElementById("msg");

msg.style.display="block";

document.querySelector("button").style.display="none";

}

setInterval(()=>{

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(h);

setTimeout(()=>h.remove(),5000);

},300);

</script>

</body>
</html>
